[project]
name = "dpsk-opc-backend"
version = "1.0.0"
description = "DPSK-OPC Backend - Message Bus System for AI Agent Communication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "DPSK-OPC Architecture Team" }
]
keywords = ["message-bus", "ai-agent", "dpsk-opc", "async", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    # Async runtime
    # "tokio[full]>=1.36",
    
    # Web framework
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    
    # Serialization
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "orjson>=3.9",
    
    # Configuration
    "pyyaml>=6.0",
    
    # Logging & Tracing
    "structlog>=24.1",
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    
    # Metrics
    "prometheus-client>=0.19",
    
    # Redis client
    "redis>=5.0",
    
    # Utilities
    "uuid6>=2024.1",
    "python-dateutil>=2.8",
    
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "black>=24.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "PT", "Q", "RET", "SIM", "TID", "ARG", "PL", "TRY", "RUF"]
ignore = ["E501", "TRY003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
