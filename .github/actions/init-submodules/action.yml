name: Init submodules
description: 用 PAT 拉取私有子模块（将 .gitmodules 中的 SSH 地址改写为 HTTPS+token）

inputs:
  token:
    description: 对 opc / opc-cat 有 read 权限的 PAT
    required: true

runs:
  using: composite
  steps:
    - name: Rewrite .gitmodules and update submodules
      shell: bash
      env:
        SUBMODULE_TOKEN: ${{ inputs.token }}
      run: |
        set -e
        if [ -z "$SUBMODULE_TOKEN" ]; then
          echo "::error::未配置 secrets.SUBMODULE_TOKEN（需对 opc、opc-cat 有 read 权限的 PAT）"
          exit 1
        fi
        # 把 .gitmodules 中的 SSH 地址改写为 HTTPS + token
        # （不回显 .gitmodules，避免 token 出现在日志中）
        # 用 -i.bak 以保证 GNU sed / BSD sed 都可移植，随后删除备份
        sed -i.bak -E "s#(url = )git@github.com:#\1https://x-access-token:${SUBMODULE_TOKEN}@github.com/#" .gitmodules
        rm -f .gitmodules.bak
        git submodule sync --recursive
        # --remote：跟随 .gitmodules 中配置的 branch（opc/cat 均为 develop）拉取各子模块
        # 的**最新提交**，而非聚合仓里钉死的固定指针 —— 这样子模块推 develop 后，
        # CI 无需手动更新聚合仓指针即可构建到最新代码。
        git submodule update --init --recursive --remote
        echo "子模块拉取完成："
        git submodule status
