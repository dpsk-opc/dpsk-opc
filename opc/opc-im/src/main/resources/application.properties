spring.application.name=opc
server.port=8080



com.xiaomizhou.dpsk.base-path=C:/Users/Administrator/.dpsk
com.xiaomizhou.dpsk.file.upload.path=${com.xiaomizhou.dpsk.base-path}/uploads
com.xiaomizhou.dpsk.file.host=http://127.0.0.1:${server.port}/

spring.web.resources.static-locations=${com.xiaomizhou.dpsk.base-path}/uploads
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.cache.period=3600

spring.devtools.restart.enabled = false

spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.url=jdbc:h2:file:${com.xiaomizhou.dpsk.base-path}/db/opc;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.url=jdbc:h2:file:${com.xiaomizhou.dpsk.base-path}/db/opc;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=root
spring.datasource.password=test

spring.h2.console.path=/h2-console
spring.h2.console.enabled=true
# spring.h2.console.settings.web-allow-others=true
# spring.h2.console.settings.web-admin-password=rootroot123
# spring.h2.console.settings.trace=true


spring.servlet.multipart.max-file-size=10MB


# Flyway 数据库迁移（替代 spring.sql.init）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 老用户数据库无 flyway_schema_history 表时，以当前数据库状态为基线，只执行后续版本
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# H2 兼容模式
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# ??? DB ? Bean ??????
spring.flyway.continue-on-error=false
mybatis-plus.mapper-locations=classpath:db/mapper/*.xml

com.xiaomizhou.opc.llm.api-key=sk-0803dabfa90b4a188e116e007f442a62
com.xiaomizhou.opc.llm.base-url=https://api.deepseek.com/v1
com.xiaomizhou.opc.llm.model-name=deepseek-v4-flash


com.xiaomizhou.dpsk.opc.rag.jvector.data-path=${com.xiaomizhou.dpsk.base-path}/db/rag/jvector
com.xiaomizhou.dpsk.opc.skill.path=C:/Users/Administrator/.yoo/skills/
com.xiaomizhou.dpsk.opc.knowledge.build.cron=0 3/5 * * * ?

# 群聊自主规划：replan 配置
workflow.replan.enabled=true
workflow.replan.max-retry=2

# ==================== 工作空间与文件访问控制 ====================
# 工作空间根目录：Agent/群未配置 workspace 时使用 <root>/<实体编码>
com.xiaomizhou.dpsk.opc.workspace.root=${com.xiaomizhou.dpsk.base-path}/workspace
# 是否启用工作空间边界校验
com.xiaomizhou.dpsk.opc.workspace.enabled=true
# 是否启用高危路径拦截（系统目录、凭据文件等，即使工作空间未配置也生效）
com.xiaomizhou.dpsk.opc.workspace.protected-path-enabled=true
# 启动时是否自动创建标准目录结构（output/tmp/scripts）
com.xiaomizhou.dpsk.opc.workspace.auto-create-structure=true
# 用户授权的外部路径是否在会话内有效（true=会话级，false=仅本次）
com.xiaomizhou.dpsk.opc.workspace.session-authorization-enabled=true
# 额外的高危路径正则（逗号分隔，可留空）
# com.xiaomizhou.dpsk.opc.workspace.protected-path-patterns[0]=^[a-z]:/secret(/.*)?$


# ??

com.xiaomizhou.dpsk.opc.log.file-path = ${com.xiaomizhou.dpsk.base-path}/logs/
com.xiaomizhou.dpsk.opc.log.file-name = dpsk-opc.log
com.xiaomizhou.dpsk.opc.log.max-history = 10
com.xiaomizhou.dpsk.opc.log.max-size = 10MB

# 日志字符集：避免中文 Windows 下默认 GBK 造成日志/控制台中文乱码
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# logging.level.com.xiaomizhou.dpsk.db.mapper=debug

